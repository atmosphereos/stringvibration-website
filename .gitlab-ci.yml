stages:
  - test
  - deploy

run_nginx_tests:
  stage: test
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    TEST_HTTP_URL: "http://nginx:80"
  before_script:
    - cp "$DOTENV" .env
    - docker compose -f docker-compose.test.yml up --build -d
    - sleep 20
  script:
    - docker compose -f docker-compose.test.yml exec -T backend npm test
  after_script:
    - docker compose -f docker-compose.test.yml down
    - rm -f .env

production_deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo '$SSH-PRIVATE-KEY' | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $SERVER-HOST >> ~/.ssh/known_hosts
  script:
    - ssh $SERVER_USER@$SERVER_HOST "
      cd /var/www/strun-vibration &&
      git pull origin main &&
      npm install --production &&
      sudo systemctl restart strun-vibration.service
      nginx -s reload
      "
  only:
   - main
  when: manual
