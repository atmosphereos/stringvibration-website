version: '3.8'

services:
  backend:
    build: .
    environment:
      - NODE_ENV=test
      - PORT=3000
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    volumes:
      - ./deploy/nginx/strun-vibration.conf:/etc/nginx/strun-vibration.conf:ro
      - ./certs:/etc/ssl/strun-vibration:ro
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      - backend
