services:
  backend:
    build: .
    env_file:
      - .env
    environment:
      - NODE_ENV=test
      - PORT=3000
    networks:
      - test-network
    ports:
      - "3001:3000"

  nginx:
    image: nginx:alpine
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/ssl/strun-vibration:ro
    depends_on:
      - backend
    ports:
      - "8085:80"
      - "8443:443"
    networks:
      - test-network
    extra_hosts:
      - "localhost=host-gateway"
      - "127.0.0.1=host-gateway"

networks:
  test-network:
    driver: bridge
