server {
    listen 80;
    server_name localhost;

    # Главное правило: перенаправлять все запросы на бэкенд
    location / {
        # 'backend' — это имя сервиса/контейнера из вашего docker-compose.yml
        # '3000' — внутренний порт, на котором запускается ваш Node.js сервер при тестах
        proxy_pass http://backend:3000; 
        
        # Передаем оригинальные заголовки, чтобы бэкенд понимал, откуда запрос
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты (чтобы тесты не падали раньше времени, если бэкенд думает)
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
