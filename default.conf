server {
    listen 80;
    server_name localhost;

    # Главное правило: перенаправлять все запросы на бэкенд
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name localhost nginx;

    # Пути к вашим SSL-сертификатам (обязательно должны быть в контейнере)
    ssl_certificate     /etc/ssl/strun-vibration/fullchain.pem;
    ssl_certificate_key /etc/ssl/strun-vibration/privkey.pem;

    # Настройки проксирования на ваш Node.js бэкенд
    location / {
        proxy_pass http://backend:3000; # Имя контейнера бэкенда и его порт
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
