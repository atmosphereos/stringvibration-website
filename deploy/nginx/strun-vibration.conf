# ============================================================================
# Nginx site config for «Вибрация струн» — TLS-terminating reverse proxy
# in front of the Node app on 127.0.0.1:3000.
#
# IDN note: вибрацияструн.рф must appear in Nginx as its Punycode form.
# On the server, compute it once with:
#
#     idn2 вибрацияструн.рф          # likely needs: apt install idn2
#     # → xn--80aab2cfecffaqcs7c.xn--p1ai   (verify against your own output)
#
# Both the Punycode and the optional www. variant are listed below. Replace
# the placeholder if `idn2` produces a different label, then run:
#
#     sudo nginx -t && sudo systemctl reload nginx
# ============================================================================

# Use a named upstream so we get HTTP/1.1 keepalive between Nginx and Node.
upstream vibratsiya_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ----- 80 → 443 redirect -----------------------------------------------------
server {
    listen      80;
    listen [::]:80;

    # IDN: вибрацияструн.рф  (Punycode form — verify with `idn2`)
    server_name xn--80aab2cfecffaqcs7c.xn--p1ai
                www.xn--80aab2cfecffaqcs7c.xn--p1ai
                89.108.98.163;

    # Long-cache HSTS preload setup needs ACME to work over HTTP — leave the
    # well-known path open if you ever switch to Let's Encrypt.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ----- HTTPS — the real server ----------------------------------------------
server {
    listen      443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name xn--80aab2cfecffaqcs7c.xn--p1ai
                www.xn--80aab2cfecffaqcs7c.xn--p1ai;

    # ---- TLS ----------------------------------------------------------------
    # Drop your certificate + private key here. If you have an intermediate
    # chain, concatenate it into fullchain.pem (`cat cert.pem chain.pem > …`).
    ssl_certificate     /etc/ssl/strun-vibration/fullchain.pem;
    ssl_certificate_key /etc/ssl/strun-vibration/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            1.1.1.1 8.8.8.8 valid=300s;

    # ---- Security headers ---------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "interest-cohort=()" always;

    # ---- Tuning -------------------------------------------------------------
    client_max_body_size 64k;       # generous headroom over express.json({ limit: '32kb' })
    client_body_timeout  20s;
    send_timeout         30s;
    keepalive_timeout    65s;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---- Static assets — cached at the edge --------------------------------
    # Long cache for fingerprint-able assets. Tweak as your asset names settle.
    location ~* \.(?:css|js|svg|woff2?|ttf|otf|ico|png|jpe?g|webp|gif|avif)$ {
        proxy_pass         http://vibratsiya_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        expires            7d;
        add_header         Cache-Control "public, max-age=604800";
        access_log         off;
    }

    # ---- App ---------------------------------------------------------------
    location / {
        proxy_pass         http://vibratsiya_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        proxy_buffering    on;
        proxy_buffer_size  8k;
        proxy_buffers      8 16k;
    }
}
